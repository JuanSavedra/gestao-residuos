name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Podemos subir o Oracle aqui para testes de integração se necessário, 
      # mas por enquanto vamos focar no build e testes unitários.
      oracle:
        image: gvenzl/oracle-xe:latest
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 1521:1521

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean verify -Dspring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE -Dspring.datasource.username=system -Dspring.datasource.password=oracle

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gestao-residuos-app
        path: target/*.jar
        retention-days: 1
