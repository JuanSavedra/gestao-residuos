version: '3.8'

services:
  app-springboot:
    build: .
    container_name: gestao-residuos-app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:oracle:thin:@oracle-db:1521:XE}
      - DB_USER=${DB_USER:-system}
      - DB_PASS=${DB_PASS:-oracle}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SERVER_PORT=8080
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure

  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oracle}
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "bash", "-c", "sqlplus -L system/${ORACLE_PASSWORD:-oracle}@//localhost:1521/XE <<< 'SELECT 1 FROM DUAL;'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  oracle-data:

networks:
  backend-network:
    driver: bridge