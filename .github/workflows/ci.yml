name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gestao_residuos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/gestao_residuos -Dspring.datasource.username=postgres -Dspring.datasource.password=password

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gestao-residuos-app
        path: target/*.jar
        retention-days: 1
